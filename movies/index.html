<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Movies</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body { background-color: #1a1d24; color: #fff; }
    .movie-card { background-color: #5b626a; border: none; }
    .movie-poster { height: 650px; object-fit: cover; }
    .movie-overview {
        font-size: 14px;
        line-height: 21px;
        height: 42px;
        overflow: hidden;
        }
  </style>
</head>
<body class="py-5">

  <div class="container">
    <h1 class="text-center fw-bold mb-5">Trending Movies 🎬</h1>
    <div id="movieGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <div class="col-12 text-center text-secondary py-5"><h4>Loading...</h4></div>
    </div>
  </div>

  <script>
    const API_KEY = '1a25fdf0a125dd0b614958ce5a78ede5';
    const grid = document.getElementById('movieGrid');


    fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}`)
      .then(response => response.json())
      .then(data => {
        // clear loading
        grid.innerHTML = '';

        // loop through all movies
        data.results.forEach(movie => {
          grid.innerHTML += `
            <div class="col">
              <div class="card movie-card h-100 rounded-3 shadow">
                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" class="card-img-top movie-poster" alt="${movie.title}">
                <div class="card-body d-flex flex-column justify-content-between p-3">
                  <div>
                    <h5 class="card-title fw-bold text-white mb-2">${movie.title}</h5>
                    <p class="movie-overview text-light mb-3">${movie.overview || 'No overview available.'}</p>
                  </div>
                  <div>
                    <span class="badge bg-warning text-dark fw-bold px-2 py-1">${movie.vote_average.toFixed(1)}</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
      })
      .catch(error => {
        console.error('Fetch error:', error);
        grid.innerHTML = '<div class="col-12 text-center text-danger py-5">Failed to load movies.</div>';
      });
  </script>
</body>
</html>
