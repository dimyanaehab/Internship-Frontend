<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhotoFolio</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--creating responsive nav bar-->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <!--photo logo-->
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-camera text-success fs-3"></i>
                    <span>PhotoFolio</span>
                </a>

                <div class="d-flex gap-3 order-lg-3 ms-lg-4 ms-auto me-3 me-lg-0">
                        <a class="text-light text-decoration-none" href="#" aria-label="Twitter">
                            <i class="bi bi-twitter-x"></i>
                        </a>
                        <a class="text-light text-decoration-none" href="#" aria-label="Facebook">
                            <i class="bi bi-facebook"></i>
                        </a>
                        <a class="text-light text-decoration-none" href="#" aria-label="Instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a class="text-light text-decoration-none" href="#" aria-label="LinkedIn">
                            <i class="bi bi-linkedin"></i>
                        </a>
                </div>    

                <!--when in mobile mode, created a menu button that collapses into the nav links-->
                <button 
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Open navigation menu"
                    >
                    <span class="navbar-toggler-icon"></span></button>


                <div class="collapse navbar-collapse order-lg-2" id="mainNavbar">       
                    <div class="navbar-nav mx-lg-auto">
                        <a 
                            class="nav-link active"
                            aria-current="page"
                            href="index.html"
                        >Home</a>
                        <a class="nav-link" href="#about">About</a>
                        <a class="nav-link" href="#gallery">Gallery</a>
                        <a class="nav-link" href="#services">Services</a>
                        <a class="nav-link" href="#contact">Contact</a>

                    </div>
                </div>
            </div>
        </nav>
    </header>
    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
