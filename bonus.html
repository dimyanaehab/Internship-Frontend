<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo</title>

    <style>
         body {
            
            background-color: black;
        }

        #logo-box {
            position: relative;
            padding: 25px 35px;
            border: 3px solid white;
            border-radius: 15px;
            margin:350px auto;
            width: fit-content;
            
        }

        #cover {
        position: absolute;
        width: 80px;
        height: 10px;
        bottom: -6px;
        left: 70%;
        background-color: black;
    }
        #logo-text {
        margin: 0;
        color: white;
        font-family: "Times New Roman", serif;
        font-size: 130px;   
        }

    </style>
</head>
<body>

    <div id="logo-box">
        <h1 id="logo-text">DIMY</h1>
        <div id="cover"></div>
    </div>
    
</body>
</html>
