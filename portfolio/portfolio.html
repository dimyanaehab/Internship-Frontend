<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoFolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Bungee&display=swap">
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>

    <!-- Header / Navigation -->
    <div class="header">
        <div class="logo"> 
            <span>PhotoFolio</span>
        </div>

        <nav class="navbar">
            <span class="nav-item active">Home</span>
            <span class="nav-item">About</span>
            <span class="nav-item">Gallery</span>
            <span class="nav-item">Services</span>
            <span class="nav-item">Contact</span>
        </nav>
    </div>

    <!-- Intro Section -->
    <div class="intro">
        <h1>I'm <span>Dimyana Ehab</span> <br> a Visual Storyteller based in Cairo</h1>
        <div class="btn-available">available for hire</div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-container">
        
        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=800&q=80" alt="Architecture Interior">
                <div class="overlay"></div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" alt="Editorial Portrait">
                <div class="overlay"></div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Mountain Landscape">
                <div class="overlay"></div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80" alt="Urban Neon Street">
                <div class="overlay"></div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=800&q=80" alt="Travel and Landscape">
                <div class="overlay"></div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80" alt="Forest Landscape">
                <div class="overlay"></div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80" alt="Fashion Portrait">
                <div class="overlay"></div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Ocean Coastline">
                <div class="overlay"></div>
            </div>
        </div>
        
    </div>

    <!-- Scroll-to-Top Button -->
    <div class="scroll-top-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fa-solid fa-arrow-up"></i>
    </div>
    
</body>
</html>
