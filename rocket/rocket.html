<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Launch</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Rocket transition properties */
    #rocket {
      font-size: 5rem;
      transition: transform 1.5s , opacity 1.2s ease;
    }

    /* Target state when launched */
    .launching {
      transform: translateY(-120vh);
    }
  </style>
</head>
<body class="vh-100 d-flex flex-column justify-content-end align-items-center pb-5 overflow-hidden">

  <!-- Rocket Container -->
  <div class="mb-3">
    <div id="rocket" class="d-inline-block">🚀</div>
  </div>

  <!-- Bootstrap Button -->
  <button id="launch-btn" class="btn btn-info btn-lg px-4 py-2 text-white fw-bold shadow text-uppercase" onclick="launchRocket()">
    Launch
  </button>

  <script>
    function launchRocket() {
      const rocket = document.getElementById("rocket");
      const button = document.getElementById("launch-btn");


      button.disabled = true;

      rocket.classList.add("launching");

 
      setTimeout(() => {
        rocket.style.transition = "none";
        rocket.classList.remove("launching");

        // Force DOM reflow
        void rocket.offsetWidth;

        rocket.style.transition = "";
        button.disabled = false;
      }, 1800);
    }
  </script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
